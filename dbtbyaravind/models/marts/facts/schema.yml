version: 2

models:
  - name: fact_sales
    description: Incrementally merged sales fact at the order and product grain.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - product_id
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: order_date
        data_tests:
          - not_null
